name: Sync with upstream

on:
  workflow_dispatch:
  schedule:
    # Midnight EST = 05:00 UTC
    - cron: '0 5 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/AdguardTeam/FiltersRegistry.git

      - name: Fetch upstream
        run: git fetch --depth=1 upstream master

      - name: Merge upstream master (unless bot commit)
        run: |
          # Get the author email of the latest commit on upstream/master
          AUTHOR_EMAIL=$(git log -1 --format=%ae upstream/master)
          
          if [[ "$AUTHOR_EMAIL" == "github-actions[bot]@users.noreply.github.com" ]]; then
            echo "Latest upstream commit is from github-actions bot — skipping merge."
            exit 0
          fi
          
          git config --global user.name "pkrayzy"
          git config --global user.email "pkrayzy@users.noreply.github.com"
          git merge upstream/master --no-edit

      - name: Push changes
        run: git push origin HEAD
