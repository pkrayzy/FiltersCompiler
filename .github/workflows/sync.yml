name: Sync with upstream

on:
  workflow_dispatch:
  schedule:
    # Midnight EST = 05:00 UTC
    - cron: '0 5 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history needed for merge
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/AdguardTeam/FiltersRegistry.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream master (unless skip ci)
        run: |
          LAST_MSG=$(git log -1 --format=%B upstream/master)
          if echo "$LAST_MSG" | grep -q "^skip ci"; then
            echo "Latest upstream commit starts with 'skip ci' — skipping merge."
            exit 0
          fi
          git config --global user.name "pkrayzy"
          git config --global user.email "pkrayzy@users.noreply.github.com"
          git merge upstream/master --no-edit

      - name: Push changes
        run: git push origin HEAD
