name: Sync with Upstream

on:
  schedule:
    - cron: '0 5 * * *'  # Runs daily at midnight EST (5 AM UTC)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream ${{ github.server_url }}/${{ github.repository_owner }}/upstream.git
        continue-on-error: true

      - name: Fetch and conditionally merge upstream
        run: |
          git fetch upstream
          git log -1 --format=%B upstream/master | grep -q "^skip ci" || git merge upstream/master

      - name: Push changes
        run: git push origin HEAD
        continue-on-error: true
